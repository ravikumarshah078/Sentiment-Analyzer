version: "3.9"

services:
  sentiment-api:
    build: .
    container_name: sentiment_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - TRANSFORMERS_CACHE=/app/cache
    restart: unless-stopped
